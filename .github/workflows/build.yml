name: build
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  doc-lint:
    name: Doc Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/doc-lint.sh

  test:
    name: Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - name: Replay sanitized translation corpus (no Jira or live model)
        run: go run . train-jql replay internal/nlfeedback/testdata/regressions.jsonl
      - run: go test -race -tags=oracle -count=1 ./internal/jqloracle
      - name: Test oracle runner
        run: python3 -m unittest discover -s scripts -p 'test_run_jql_oracle*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dashboard behavior
        run: |
          node scripts/test_dashboard_refresh.cjs
          node scripts/test_jira_connection.cjs
